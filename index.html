============================================================\n// 4. Prep data (flatten groups, keep group boundaries for rendering)\n// ================================================================\nconst folders = rawData.map(function(folder, folderIndex){\n  let counter = 0;\n  const groups = folder.groups.map(function(group){\n    const items = group.items.map(function(item){\n      counter++;\n      return {\n        id: folderIndex + '-' + counter,\n        title: item.title,\n        lower: item.title.toLowerCase(),\n        video: item.video || null,\n        pdfs: item.pdfs || []\n      };\n    });\n    return { name: group.name, lower: (group.name || '').toLowerCase(), items: items };\n  });\n  const allItems = [].concat.apply([], groups.map(function(g){ return g.items; }));\n  return {\n    index: folderIndex,\n    icon: folder.icon,\n    name: folder.name,\n    lower: folder.name.toLowerCase(),\n    groups: groups,\n    allItems: allItems,\n    itemCount: allItems.length,\n    open: false,\n    bodyEl: null,\n    bodyInnerEl: null,\n    cardEl: null,\n    built: false\n  };\n});\n\nconst TOTAL_FOLDERS = folders.length;\nconst TOTAL_FILES = folders.reduce(function(sum, f){ return sum + f.itemCount; }, 0);\nstatFoldersEl.textContent = TOTAL_FOLDERS;\nstatFilesEl.textContent = TOTAL_FILES;\n\n// ================================================================\n// 5. Helpers\n// ================================================================\nfunction escapeHTML(str){\n  return str.replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;');\n}\nfunction highlight(text, query){\n  const safe = escapeHTML(text);\n  if (!query) return safe;\n  const lowerText = text.toLowerCase();\n  const idx = lowerText.indexOf(query);\n  if (idx === -1) return safe;\n  const before = escapeHTML(text.slice(0, idx));\n  const match = escapeHTML(text.slice(idx, idx + query.length));\n  const after = escapeHTML(text.slice(idx + query.length));\n  return before + '<mark>' + match + '<\/mark>' + after;\n}\n\nfunction createFileItemEl(item, query){\n  const el = document.createElement('div');\n  el.className = 'file-item';\n\n  const name = document.createElement('div');\n  name.className = 'file-name';\n  name.innerHTML = highlight(item.title, query);\n  name.title = item.title;\n  el.appendChild(name);\n\n  const actions = document.createElement('div');\n  actions.className = 'file-actions';\n  if (item.video){\n    const a = document.createElement('a');\n    a.className = 'open-btn video';\n    a.href = item.video; a.target = '_blank'; a.rel = 'noopener';\n    a.innerHTML = ICONS.video + '<span>Video<\/span>';\n    actions.appendChild(a);\n  }\n  item.pdfs.forEach(function(pdfUrl, i){\n    const a = document.createElement('a');\n    a.className = 'open-btn pdf';\n    a.href = pdfUrl; a.target = '_blank'; a.rel = 'noopener';\n    a.innerHTML = ICONS.pdf + '<span>' + (i === 0 ? 'PDF' : 'PDF ' + (i+1)) + '<\/span>';\n    actions.appendChild(a);\n  });\n  el.appendChild(actions);\n  return el;\n}\n\nfunction populateFolderBody(folder, query, groupsOverride){\n  const groupsToRender = groupsOverride || folder.groups;\n  const frag = document.createDocumentFragment();\n  groupsToRender.forEach(function(group){\n    if (!group.items.length) return;\n    const block = document.createElement('div');\n    block.className = 'group-block';\n    if (group.name){\n      const label = document.createElement('div');\n      label.className = 'group-label';\n      label.innerHTML = highlight(group.name, query);\n      block.appendChild(label);\n    }\n    const list = document.createElement('div');\n    list.className = 'file-list';\n    group.items.forEach(function(item){ list.appendChild(createFileItemEl(item, query)); });\n    block.appendChild(list);\n    frag.appendChild(block);\n  });\n  folder.bodyInnerEl.innerHTML = '';\n  folder.bodyInnerEl.appendChild(frag);\n}\n\nfunction setFolderOpen(folder, open, query, groupsOverride){\n  folder.open = open;\n  folder.cardEl.classList.toggle('open', open);\n  if (open){\n    populateFolderBody(folder, query, groupsOverride);\n    folder.built = true;\n  }\n  folder.bodyEl.style.maxHeight = open ? folder.bodyEl.scrollHeight + 800 + 'px' : '0px';\n}\n\nfunction toggleFolder(folder){\n  setFolderOpen(folder, !folder.open, searchInputEl.value.trim().toLowerCase());\n}\n\nfunction createFolderCardEl(folder){\n  const card = document.createElement('div');\n  card.className = 'folder-card';\n  folder.cardEl = card;\n\n  const header = document.createElement('div');\n  header.className = 'folder-header';\n  header.innerHTML =\n    '<div class=\"folder-icon-wrap\">' + folder.icon + '<\/div>' +\n    '<div class=\"folder-title-block\"><h3 class=\"folder-title\" data-title><\/h3><\/div>' +\n    '<div class=\"folder-meta\"><span class=\"file-count-badge\" data-count>' + folder.itemCount + ' items<\/span>' +\n    '<span class=\"chevron\">' + ICONS.chevron + '<\/span><\/div>';\n  header.querySelector('[data-title]').innerHTML = escapeHTML(folder.name);\n  header.addEventListener('click', function(){ toggleFolder(folder); });\n  card.appendChild(header);\n\n  const body = document.createElement('div');\n  body.className = 'folder-body';\n  folder.bodyEl = body;\n  const bodyInner = document.createElement('div');\n  bodyInner.className = 'folder-body-inner';\n  folder.bodyInnerEl = bodyInner;\n  body.appendChild(bodyInner);\n  card.appendChild(body);\n\n  return card;\n}\n\nfunction renderAllFolderShells(){\n  const frag = document.createDocumentFragment();\n  folders.forEach(function(folder){ frag.appendChild(createFolderCardEl(folder)); });\n  folderGridEl.appendChild(frag);\n}\nrenderAllFolderShells();\n\n// ================================================================\n// 6. Search\n// ================================================================\nfunction renderEmptyState(){\n  folderGridEl.innerHTML = '';\n  const el = document.createElement('div');\n  el.classNa sEl = document.getElementById('statFiles');\nconst breadcrumbEl = document.getElementById('breadcrumb');\n\n// ================================================================\n// 4. Prep data\n// ================================================================\nconst folders = rawData.map(function(folder, folderIndex){\n  const items = folder.items.map(function(item, itemIndex){\n    return {\n      id: folderIndex + '-' + itemIndex,\n      title: item.title,\n      lower: item.title.toLowerCase(),\n      video: item.video || null,\n      pdf: item.pdf || null\n    };\n  });\n  return {\n    index: folderIndex,\n    key: folder.key,\n    icon: folder.icon,\n    name: folder.name,\n    lower: folder.name.toLowerCase(),\n    items: items,\n    itemCount: items.length,\n    open: false,\n    bodyEl: null,\n    listEl: null,\n    cardEl: null,\n    built: false\n  };\n});\n\nconst TOTAL_FOLDERS = folders.length;\nconst TOTAL_FILES = folders.reduce(function(sum, f){ return sum + f.itemCount; }, 0);\nstatFoldersEl.textContent = TOTAL_FOLDERS;\nstatFilesEl.textContent = TOTAL_FILES;\n\n// ================================================================\n// 5. Helpers\n// ================================================================\nfunction escapeHTML(str){\n  return str.replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;');\n}\nfunction highlight(text, query){\n  const safe = escapeHTML(text);\n  if (!query) return safe;\n  const lowerText = text.toLowerCase();\n  const idx = lowerText.indexOf(query);\n  if (idx === -1) return safe;\n  const before = escapeHTML(text.slice(0, idx));\n  const match = escapeHTML(text.slice(idx, idx + query.length));\n  const after = escapeHTML(text.slice(idx + query.length));\n  return before + '<mark>' + match + '<\/mark>' + after;\n}\n\nfunction createFileItemEl(item, query){\n  const el = document.createElement('div');\n  el.className = 'file-item';\n\n  const name = document.createElement('div');\n  name.className = 'file-name';\n  name.innerHTML = highlight(item.title, query);\n  name.title = item.title;\n  el.appendChild(name);\n\n  const actions = document.createElement('div');\n  actions.className = 'file-actions';\n  if (item.video){\n    const a = document.createElement('a');\n    a.className = 'open-btn video';\n    a.href = item.video; a.target = '_blank'; a.rel = 'noopener';\n    a.innerHTML = ICONS.video + '<span>Video<\/span>';\n    actions.appendChild(a);\n  }\n  if (item.pdf){\n    const a = document.createElement('a');\n    a.className = 'open-btn pdf';\n    a.href = item.pdf; a.target = '_blank'; a.rel = 'noopener';\n    a.innerHTML = ICONS.pdf + '<span>PDF<\/span>';\n    actions.appendChild(a);\n  }\n  el.appendChild(actions);\n  return el;\n}\n\nfunction populateFileList(folder, query, subsetItems){\n  const items = subsetItems || folder.items;\n  const frag = document.createDocumentFragment();\n  for (let i = 0; i < items.length; i++){\n    frag.appendChild(createFileItemEl(items[i], query));\n  }\n  folder.listEl.innerHTML = '';\n  folder.listEl.appendChild(frag);\n}\n\nfunction setFolderOpen(folder, open, query, subsetItems){\n  folder.open = open;\n  folder.cardEl.classList.toggle('open', open);\n  if (open && !folder.built){\n    populateFileList(folder, query, subsetItems);\n    folder.built = true;\n  }\n  folder.bodyEl.style.maxHeight = open ? folder.bodyEl.scrollHeight + 400 + 'px' : '0px';\n}\n\nfunction toggleFolder(folder){\n  setFolderOpen(folder, !folder.open, searchInputEl.value.trim().toLowerCase());\n}\n\nfunction createFolderCardEl(folder){\n  const card = document.createElement('div');\n  card.className = 'folder-card';\n  folder.cardEl = card;\n\n  const header = document.createElement('div');\n  header.className = 'folder-header';\n  header.innerHTML =\n    '<div class=\"folder-icon-wrap\">' + folder.icon + '<\/div>' +\n    '<div class=\"folder-title-block\"><h3 class=\"folder-title\" data-title><\/h3><\/div>' +\n    '<div class=\"folder-meta\"><span class=\"file-count-badge\" data-count>' + folder.itemCount + ' items<\/span>' +\n    '<span class=\"chevron\">' + ICONS.chevron + '<\/span><\/div>';\n  header.querySelector('[data-title]').innerHTML = escapeHTML(folder.name);\n  header.addEventListener('click', function(){ toggleFolder(folder); });\n  card.appendChild(header);\n\n  const body = document.createElement('div');\n  body.className = 'folder-body';\n  folder.bodyEl = body;\n  const bodyInner = document.createElement('div');\n  bodyInner.className = 'folder-body-inner';\n  const list = document.createElement('div');\n  list.className = 'file-list';\n  folder.listEl = list;\n  bodyInner.appendChild(list);\n  body.appendChild(bodyInner);\n  card.appendChild(body);\n\n  return card;\n}\n\nfunction renderAllFolderShells(){\n  const frag = document.createDocumentFragment();\n  folders.forEach(function(folder){\n    frag.appendChild(createFolderCardEl(folder));\n  });\n  folderGridEl.appendChild(frag);\n}\nrenderAllFolderShells();\n\n// ================================================================\n// 6. Search\n// ================================================================\nfunction renderEmptyState(){\n  folderGridEl.innerHTML = '';\n  const el = document.createElement('div');\n  el.className = 'empty-state';\n  el.innerHTML = ICONS.emptyBox + '<h3>No results found<\/h3><p>Try a different search term.<\/p>';\n  folderGridEl.appendChild(el);\n}\n\nlet emptyShown = false;\nfunction restoreFolderGrid(){\n  if (emptyShown){\n    folderGridEl.innerHTML = '';\n    folders.forEach(function(folder){ folderGridEl.appendChild(folder.cardEl); });\n    emptyShown = false;\n  }\n}\n\nfunction updateBreadcrumb(query){\n  if (!query){ breadcrumbEl.textContent = ''; return; }\n  let matches = 0;\n  folders.forEach(function(f){\n    if (f.lower.indexOf(query) !== -1) matches += f.itemCount;\n    else f.items.forEach(function(it){ if (it.lower.indexOf(query) !== -1) matches++; });\n  });\n  breadcrumbEl.textContent = matches + ' result' + (matches === 1 ? '' : 's') + ' for \"' + query + '\"';\n}\n\nfunction applySearch(rawQuery){\n  const query = rawQuery.trim().toLowerCase();\n  clearBtnEl.classList.toggle('show', query.length > 0);\n  updateBreadcrumb(query);\n\n  if (!query){\n    restoreFolderGrid();\n    folders.forEach(function(folder){\n      folder.cardEl.classList.remove('hidden-card');\n      folder.cardEl.querySelector('[data-title]').innerHTML = escapeHTML(folder.name);\n      folder.cardEl.querySelector('[data-count]').textContent = folder.itemCount + ' items';\n      if (folder.built) populateFileList(folder, '');\n    });\n    return;\n  }\n\n  restoreFolderGrid();\n  let anyVisible = false;\n  folders.forEach(function(folder){\n    const nameMatches = folder.lower.indexOf(query) !== -1;\n    const matchedItems = folder.items.filter(function(it){ return it.lower.indexOf(query) !== -1; });\n    const show = nameMatches || matchedItems.length > 0;\n    folder.cardEl.classList.toggle('hidden-card', !show);\n    if (!show) return;\n    anyVisible = true;\n    folder.cardEl.querySelector('[data-title]').innerHTML = highlight(folder.name, query);\n    const subset = nameMatches && matchedItems.length === 0 ? folder.items : matchedItems;\n    folder.cardEl.querySelector('[data-count]').textContent = subset.length + ' items';\n    setFolderOpen(folder, true, query, subset);\n  });\n\n  if (!anyVisible){ renderEmptyState(); emptyShown = true; }\n}\n\nfunction handleSearchInput(){ applySearch(searchInputEl.value); }\nsearchInputEl.addEventListener('input', handleSearchInput);\nclearBtnEl.addEventListener('click', function(){\n  searchInputEl.value = '';\n  applySearch('');\n  searchInputEl.focus();\n});\n\nfunction expandAll(){\n  folders.forEach(function(f){ if (!f.cardEl.classList.contains('hidden-card')) setFolderOpen(f, true, searchInputEl.value.trim().toLowerCase()); });\n}\nfunction collapseAll(){\n  folders.forEach(function(f){ setFolderOpen(f, false); });\n}\nexpandAllBtnEl.addEventListener('click', expandAll);\ncollapseAllBtnEl.addEventListener('click', collapseAll);\n\n<\/script>\n<\/body>\n<\/html>\n", "Parmar Batches/Parmar Reasoning Revision Vod": "<!DOCTYPE html>\n\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes\" name=\"viewport\"/>\n<title>PARMAR'S REASONING VOD<\/title>\n<link href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css\" rel=\"stylesheet\"/>\n<style>\n        * {\n            margin: 0;\n            padding: 0;\n            box-sizing: border-box;\n            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;\n        }\n\n        body {\n            background: #f2f4f8;\n            min-height: 100vh;\n            padding: 16px 12px 40px;\n        }\n\n        .app-container {\n            max-width: 800px;\n            margin: 0 auto;\n            background: #ffffff;\n            border-radius: 28px 28px 24px 24px;\n            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.03);\n            overflow: hidden;\n            padding: 20px 18px 30px;\n        }\n\n        .brand-header {\n            display: flex;\n            flex-direction: column;\n            gap: 4px;\n            margin-bottom: 22px;\n        }\n\n        .brand-header .course-badge {\n            display: flex;\n            align-items: center;\n            gap: 8px;\n            flex-wrap: wrap;\n        }\n\n        .brand-header .course-badge h1 {\n            font-size: 1.5rem;\n            font-weight: 700;\n            letter-spacing: -0.3px;\n            color: #0b1a33;\n        }\n\n        .brand-header .course-badge .vod-tag {\n            background: #eef3fe;\n            color: #1f5fcf;\n            font-weight: 600;\n            font-size: 0.7rem;\n            padding: 4px 12px;\n            border-radius: 40px;\n            letter-spacing r 2 mock Test\", sub: \"Practice Set 04 2023-08-26\", video: \"https://publicbotshub.blogspot.com/p/file-stream-bot.html?watch=6a85d835e8b0d4a4f8e7f0e3\", pdf: \"https://publicbotshub.blogspot.com/p/file-stream-bot.html?dl=6a85d840e8b0d4a4f8e7f0e5\" },\n            { main: \"Tier 2 mock Test\", sub: \"Practice Set 05 2023-08-29\", video: \"https://publicbotshub.blogspot.com/p/file-stream-bot.html?watch=6a85d859e8b0d4a4f8e7f0e9\", pdf: \"https://publicbotshub.blogspot.com/p/file-stream-bot.html?dl=6a85d865e8b0d4a4f8e7f0eb\" },\n            { main: \"Tier 2 mock Test\", sub: \"Practice Set 06 2023-09-06\", video: \"https://publicbotshub.blogspot.com/p/file-stream-bot.html?watch=6a85d87ee8b0d4a4f8e7f0ef\", pdf: \"https://publicbotshub.blogspot.com/p/file-stream-bot.html?dl=6a85d888e8b0d4a4f8e7f0f1\" },\n            { main: \"Tier 2 mock Test\", sub: \"Practice Set 07 2023-09-09\", video: \"https://publicbotshub.blogspot.com/p/file-stream-bot.html?watch=6a85d892e8b0d4a4f8e7f0f3\", pdf: \"https://publicbotshub.blogspot.com/p/file-stream-bot.html?dl=6a85d89de8b0d4a4f8e7f0f5\" },\n            { main: \"Tier 2 mock Test\", sub: \"Practice Set 8 2023-09-18\", video: \"https://publicbotshub.blogspot.com/p/file-stream-bot.html?watch=6a85d8b2e8b0d4a4f8e7f0f9\", pdf: \"https://publicbotshub.blogspot.com/p/file-stream-bot.html?dl=6a85d8bfe8b0d4a4f8e7f0fb\" },\n            { main: \"Tier 2 mock Test\", sub: \"Practice Set 9 2023-09-23\", video: \"https://publicbotshub.blogspot.com/p/file-stream-bot.html?watch=6a85d8d6e8b0d4a4f8e7f0ff\", pdf: \"https://publicbotshub.blogspot.com/p/file-stream-bot.html?dl=6a85d8e0e8b0d4a4f8e7f101\" },\n            { main: \"Tier 2 mock Test\", sub: \"Practice set 10 2023-09-29\", video: \"https://publicbotshub.blogspot.com/p/file-stream-bot.html?watch=6a85d8f7e8b0d4a4f8e7f105\", pdf: \"https://publicbotshub.blogspot.com/p/file-stream-bot.html?dl=6a85d901e8b0d4a4f8e7f107\" }\n        ];\n\n        // -------- helpers --------\n        function groupByMain(data) {\n            const map = new Map();\n            data.forEach(item => {\n                if (!map.has(item.main)) map.set(item.main, []);\n                map.get(item.main).push(item);\n            });\n            return map;\n        }\n\n        function createTopicItem(main, count) {\n            const div = document.createElement('div');\n            div.className = 'topic-item';\n            div.setAttribute('data-main', main);\n            div.innerHTML = `\n                <div class=\"info\">\n                    <div class=\"title\">${main} <span class=\"count\">${count} files<\/span><\/div>\n                    <div class=\"desc\"><i class=\"far fa-file-alt\"><\/i> ${count} resources<\/div>\n                <\/div>\n                <div class=\"arrow\"><i class=\"fas fa-chevron-right\"><\/i><\/div>\n            `;\n            return div;\n        }\n\n        // 🔥 EK CARD ME DONO BUTTONS\n        function createSubCard(item) {\n            let buttonsHTML = '';\n\n            // Video button\n            if (item.video) {\n                buttonsHTML += `<a href=\"${item.video}\" target=\"_blank\" class=\"video-link\"><i class=\"fas fa-play-circle\"><\/i> Watch Video<\/a>`;\n            }\n\n            // PDF button\n            if (item.pdf) {\n                buttonsHTML += `<a href=\"${item.pdf}\" target=\"_blank\" class=\"pdf-link\"><i class=\"fas fa-file-pdf\"><\/i> Download PDF<\/a>`;\n            }\n\n            const card = document.createElement('div');\n            card.className = 'subtopic-card';\n            card.innerHTML = `\n                <div class=\"sub-header\">\n                    <span class=\"sub-title\">${item.sub}<\/span>\n                <\/div>\n                <div class=\"sub-meta\">\n                    <span><i class=\"far fa-calendar-alt\"><\/i> ${item.sub.match(/\\d{4}-\\d{2}-\\d{2}/)?.[0] || 'N/A'}<\/span>\n                    ${item.video ? `<span><i class=\"fas fa-video\" style=\"color:#1f5fcf;\"><\/i> Video<\/span>` : ''}\n                    ${item.pdf ? `<span><i class=\"fas fa-file-pdf\" style=\"color:#dc3545;\"><\/i> PDF<\/span>` : ''}\n                <\/div>\n                <div class=\"action-links\">\n                    ${buttonsHTML}\n                <\/div>\n            `;\n            return card;\n        }\n\n        // -------- render logic --------\n        const mainView = document.getElementById('mainView');\n        const detailView = document.getElementById('detailView');\n        const topicGrid = document.getElementById('topicGrid');\n        const subtopicList = document.getElementById('subtopicList');\n        const detailTitle = document.getElementById('detailTitle');\n        const backBtn = document.getElementById('backBtn');\n        const searchInput = document.getElementById('globalSearch');\n\n        let currentMain = null;\n\n        function renderMainView(filter = '') {\n            const grouped = groupByMain(rawData);\n            const sorted = Array.from(grouped.keys()).sort();\n\n            topicGrid.innerHTML = '';\n            const filtered = filter.trim() === '' ? sorted : sorted.filter(t => t.toLowerCase().includes(filter.toLowerCase()));\n\n            if (filtered.length === 0) {\n                topicGrid.innerHTML = `<div style=\"padding:30px 0; text-align:center; color:#657a94;\">No topics found<\/div>`;\n                return;\n            }\n\n            filtered.forEach(main => {\n                const items = grouped.get(main) || [];\n                const count = items.length;\n                const el = createTopicItem(main, count);\n                el.addEventListener('click', () => openDetailView(main));\n                topicGrid.appendChild(el);\n            });\n        }\n\n        function openDetailView(main) {\n            currentMain = main;\n            const grouped = groupByMain(rawData);\n            const items = grouped.get(main) || [];\n            detailTitle.textContent = main;\n\n lder.key,\n    icon: folder.icon,\n    name: folder.name,\n    lower: folder.name.toLowerCase(),\n    items: items,\n    itemCount: items.length,\n    open: false,\n    bodyEl: null,\n    listEl: null,\n    cardEl: null,\n    built: false\n  };\n});\n\nconst TOTAL_FOLDERS = folders.length;\nconst TOTAL_FILES = folders.reduce(function(sum, f){ return sum + f.itemCount; }, 0);\nstatFoldersEl.textContent = TOTAL_FOLDERS;\nstatFilesEl.textContent = TOTAL_FILES;\n\n// ================================================================\n// 5. Helpers\n// ================================================================\nfunction escapeHTML(str){\n  return str.replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;');\n}\nfunction highlight(text, query){\n  const safe = escapeHTML(text);\n  if (!query) return safe;\n  const lowerText = text.toLowerCase();\n  const idx = lowerText.indexOf(query);\n  if (idx === -1) return safe;\n  const before = escapeHTML(text.slice(0, idx));\n  const match = escapeHTML(text.slice(idx, idx + query.length));\n  const after = escapeHTML(text.slice(idx + query.length));\n  return before + '<mark>' + match + '<\/mark>' + after;\n}\n\nfunction createFileItemEl(item, query){\n  const el = document.createElement('div');\n  el.className = 'file-item';\n\n  const name = document.createElement('div');\n  name.className = 'file-name';\n  name.innerHTML = highlight(item.title, query);\n  name.title = item.title;\n  el.appendChild(name);\n\n  const actions = document.createElement('div');\n  actions.className = 'file-actions';\n  if (item.video){\n    const a = document.createElement('a');\n    a.className = 'open-btn video';\n    a.href = item.video; a.target = '_blank'; a.rel = 'noopener';\n    a.innerHTML = ICONS.video + '<span>Video<\/span>';\n    actions.appendChild(a);\n  }\n  if (item.pdf){\n    const a = document.createElement('a');\n    a.className = 'open-btn pdf';\n    a.href = item.pdf; a.target = '_blank'; a.rel = 'noopener';\n    a.innerHTML = ICONS.pdf + '<span>PDF<\/span>';\n    actions.appendChild(a);\n  }\n  el.appendChild(actions);\n  return el;\n}\n\nfunction populateFileList(folder, query, subsetItems){\n  const items = subsetItems || folder.items;\n  const frag = document.createDocumentFragment();\n  for (let i = 0; i < items.length; i++){\n    frag.appendChild(createFileItemEl(items[i], query));\n  }\n  folder.listEl.innerHTML = '';\n  folder.listEl.appendChild(frag);\n}\n\nfunction setFolderOpen(folder, open, query, subsetItems){\n  folder.open = open;\n  folder.cardEl.classList.toggle('open', open);\n  if (open && !folder.built){\n    populateFileList(folder, query, subsetItems);\n    folder.built = true;\n  }\n  folder.bodyEl.style.maxHeight = open ? folder.bodyEl.scrollHeight + 400 + 'px' : '0px';\n}\n\nfunction toggleFolder(folder){\n  setFolderOpen(folder, !folder.open, searchInputEl.value.trim().toLowerCase());\n}\n\nfunction createFolderCardEl(folder){\n  const card = document.createElement('div');\n  card.className = 'folder-card';\n  folder.cardEl = card;\n\n  const header = document.createElement('div');\n  header.className = 'folder-header';\n  header.innerHTML =\n    '<div class=\"folder-icon-wrap\">' + folder.icon + '<\/div>' +\n    '<div class=\"folder-title-block\"><h3 class=\"folder-title\" data-title><\/h3><\/div>' +\n    '<div class=\"folder-meta\"><span class=\"file-count-badge\" data-count>' + folder.itemCount + ' items<\/span>' +\n    '<span class=\"chevron\">' + ICONS.chevron + '<\/span><\/div>';\n  header.querySelector('[data-title]').innerHTML = escapeHTML(folder.name);\n  header.addEventListener('click', function(){ toggleFolder(folder); });\n  card.appendChild(header);\n\n  const body = document.createElement('div');\n  body.className = 'folder-body';\n  folder.bodyEl = body;\n  const bodyInner = document.createElement('div');\n  bodyInner.className = 'folder-body-inner';\n  const list = document.createElement('div');\n  list.className = 'file-list';\n  folder.listEl = list;\n  bodyInner.appendChild(list);\n  body.appendChild(bodyInner);\n  card.appendChild(body);\n\n  return card;\n}\n\nfunction renderAllFolderShells(){\n  const frag = document.createDocumentFragment();\n  folders.forEach(function(folder){\n    frag.appendChild(createFolderCardEl(folder));\n  });\n  folderGridEl.appendChild(frag);\n}\nrenderAllFolderShells();\n\n// ================================================================\n// 6. Search\n// ================================================================\nfunction renderEmptyState(){\n  folderGridEl.innerHTML = '';\n  const el = document.createElement('div');\n  el.className = 'empty-state';\n  el.innerHTML = ICONS.emptyBox + '<h3>No results found<\/h3><p>Try a different search term.<\/p>';\n  folderGridEl.appendChild(el);\n}\n\nlet emptyShown = false;\nfunction restoreFolderGrid(){\n  if (emptyShown){\n    folderGridEl.innerHTML = '';\n    folders.forEach(function(folder){ folderGridEl.appendChild(folder.cardEl); });\n    emptyShown = false;\n  }\n}\n\nfunction updateBreadcrumb(query){\n  if (!query){ breadcrumbEl.textContent = ''; return; }\n  let matches = 0;\n  folders.forEach(function(f){\n    if (f.lower.indexOf(query) !== -1) matches += f.itemCount;\n    else f.items.forEach(function(it){ if (it.lower.indexOf(query) !== -1) matches++; });\n  });\n  breadcrumbEl.textContent = matches + ' result' + (matches === 1 ? '' : 's') + ' for \"' + query + '\"';\n}\n\nfunction applySearch(rawQuery){\n  const query = rawQuery.trim().toLowerCase();\n  clearBtnEl.classList.toggle('show', query.length > 0);\n  updateBreadcrumb(query);\n\n  if (!query){\n    restoreFolderGrid();\n    folders.forEach(function(folder){\n      folder.cardEl.classList.remove('hidden-card');\n      folder.cardEl.querySelector('[data-title]').innerHTML = escapeHTML(folder.name);\n      folder.cardEl.querySelector('[data-count]').textContent = folder.itemCount + ' items';\n      if (folder.built) populateFileList(folder, '');\n    });\n    return;\n  }\n\n  restoreFolderGrid();\n  let anyVisible = false;\n  folders.forEach(function(folder){\n    const nameMatches = folder.lower.indexOf(query) !== -1;\n    const matchedItems = folder.items.filter(function(it){ return it.lower.indexOf(query) !== -1; });\n    const show = nameMatches || matchedItems.length > 0;\n    folder.cardEl.classList.toggle('hidden-card', !show);\n    if (!show) return;\n    anyVisible = true;\n    folder.cardEl.querySelector('[data-title]').innerHTML = highlight(folder.name, query);\n    const subset = nameMatches && matchedItems.length === 0 ? folder.items : matchedItems;\n    folder.cardEl.querySelector('[data-count]').textContent = subset.length + ' items';\n    setFolderOpen(folder, true, query, subset);\n  });\n\n  if (!anyVisible){ renderEmptyState(); emptyShown = true; }\n}\n\nfunction handleSearchInput(){ applySearch(searchInputEl.value); }\nsearchInputEl.addEventListener('input', handleSearchInput);\nclearBtnEl.addEventListener('click', function(){\n  searchInputEl.value = '';\n  applySearch('');\n  searchInputEl.focus();\n});\n\nfunction expandAll(){\n  folders.forEach(function(f){ if (!f.cardEl.classList.contains('hidden-card')) setFolderOpen(f, true, searchInputEl.value.trim().toLowerCase()); });\n}\nfunction collapseAll(){\n  folders.forEach(function(f){ setFolderOpen(f, false); });\n}\nexpandAllBtnEl.addEventListener('click', expandAll);\ncollapseAllBtnEl.addEventListener('click', collapseAll);\n\n<\/script>\n<\/body>\n<\/html>\n", "Parmar Batches/PC Batch 2.0": "<!DOCTYPE html>\n\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0, user-scalable=yes\" name=\"viewport\"/>\n<title>PC BATCH 2.0 | Computer Course<\/title>\n<script src=\"https://cdn.tailwindcss.com\">\n<\/script>\n<link href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css\" rel=\"stylesheet\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap\" rel=\"stylesheet\"/>\n<style>\n        /* ----- LIGHT & SPACIOUS THEME ----- */\n        :root {\n            --bg-start: #f0f4fb;\n            --bg-end: #e3eaf3;\n            --glass-bg: rgba(255, 255, 255, 0.82);\n            --glass-border: rgba(255, 255, 255, 0.5);\n            --text-primary: #0b1a2e;\n            --text-secondary: #1e3a5f;\n            --text-muted: #5b6f87;\n            --card-shadow: 0 12px 40px rgba(0, 20, 40, 0.06), 0 0 0 1px rgba(255, 255, 255, 0.6);\n            --card-hover-shadow: 0 20px 56px rgba(0, 20, 40, 0.10), 0 0 0 1px rgba(255, 255, 255, 0.8);\n        }\n        * {\n            scroll-behavior: smooth;\n        }\n        body {\n            font-family: 'Inter', -apple-system, sans-serif;\n            background: linear-gradient(160deg, var(--bg-start), var(--bg-end));\n            color: var(--text-primary);\n            min-height: 100vh;\n            overflow-x: hidden;\n            padding: 1.5rem 1.25rem 8rem;\n        }\n        /* progress */\n        #progress-container {\n            position: fixed;\n            top: 0;\n            left: 0;\n            width: 100%;\n            height: 4px;\n            background: rgba(0, 0, 0, 0.04);\n            z-index: 10000;\n            border-radius: 0 0 4px 4px;\n        }\n        #progress-bar {\n            height: 100%;\n            width: 0%;\n            background: linear-gradient(90deg, #2563eb, #3b82f6, #06b6d4);\n            box-shadow: 0 0 20px rgba(37, 99, 235, 0.3);\n            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);\n            border-radius: 0 4px 4px 0;\n        }\n        /* glass card – soft & spacious */\n        .glass-card {\n            background: var(--glass-bg);\n            backdrop-filter: blur(20px);\n            -webkit-backdrop-filter: blur(20px);\n            border: 1px solid var(--glass-border);\n            border-radius: 32px;\n            box-shadow: var(--card-shadow);\n            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);\n        }\n        .glass-card:hover {\n            box-shadow: var(--card-hover-shadow);\n            transform: translateY(-2px);\n        }\n        .glass-card:active {\n            transform: scale(0.98);\n        }\n        /* buttons – elevated & smooth */\n        .btn-action {\n            display: inline-flex;\n            align-items: center;\n            justify-content: center;\n            border-radius: 1rem;\n            padding: 0.95rem 0;\n            font-size: 11px;\n            font-weight: 800;\n            text-transform: uppercase;\n            color: white;\n            cursor: pointer;\n            border: none;\n            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);\n            width: 100%;\n            letter-spacing: 0.4px;\n            gap: 8px;\n            position: relative;\n            overflow: hidden;\n        }\n        .btn-action::after {\n            content: '';\n            position: absolute;\n            inset: 0;\n            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 60%);\n            pointer-events: none;\n        }\n        .btn-action:active {\n            transform: scale(0.95);\n        }\n        .btn-action:hover {\n            transform: translateY(-2px) scale(1.01);\n            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);\n        }\n        .btn-video {\n            background: linear-gradient(135deg, #2563eb, #1d4ed8);\n        }\n        .btn-eng {\n            background: linear-gradient(135deg, #6366f1, #4f46e5);\n        }\n        .btn-hindi {\n            background: linear-gradient(135deg, #8b5cf6, #7c3aed);\n        }\n        .btn-quiz {\n            background: linear-gradient(135deg, #ec4899, #db2777);\n        }\n        .btn-ppt {\n            background: linear-gradient(135deg, #06b6d4, #0891b2);\n        }\n        .btn-pdf {\n            background: linear-gradient(135deg, #f59e0b \n            backdrop-filter: blur(10px);\n            z-index: 10001;\n        }\n\n        /* subject icon */\n        .subject-icon {\n            width: 52px;\n            height: 52px;\n            border-radius: 18px;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            font-size: 1.5rem;\n            flex-shrink: 0;\n            background: rgba(37, 99, 235, 0.07);\n            color: #2563eb;\n            transition: all 0.3s ease;\n        }\n        .glass-card:hover .subject-icon {\n            background: rgba(37, 99, 235, 0.13);\n            transform: scale(1.02);\n        }\n        .badge-count {\n            background: rgba(37, 99, 235, 0.10);\n            color: #1d4ed8;\n            font-size: 10px;\n            padding: 3px 12px;\n            border-radius: 40px;\n            font-weight: 700;\n            letter-spacing: 0.3px;\n        }\n\n        /* footer */\n        .footer-light {\n            background: rgba(255, 255, 255, 0.88);\n            backdrop-filter: blur(40px);\n            border-top: 1px solid rgba(0, 0, 0, 0.04);\n            padding: 1.25rem 1.5rem;\n        }\n\n        /* popup */\n        @keyframes floatUp {\n            from {\n                opacity: 0;\n                transform: translateY(32px) scale(0.96);\n            }\n            to {\n                opacity: 1;\n                transform: translateY(0) scale(1);\n            }\n        }\n        .popup-card {\n            animation: floatUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);\n            background: white;\n            border-radius: 36px;\n            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.12);\n        }\n\n        /* smooth transitions for sections */\n        #subject-section,\n        #category-section,\n        #content-section {\n            transition: opacity 0.3s ease, transform 0.3s ease;\n        }\n        #subject-section.hidden,\n        #category-section.hidden,\n        #cont an>\n                    <i class=\"fas fa-arrow-right ml-auto text-blue-300/60 text-xs\"><\/i>\n                <\/div>\n                <div onclick=\"showItems('WEEKLY TESTS')\" class=\"glass-card p-7 border-l-4 border-pink-400 cursor-pointer flex items-center active:scale-[0.97] transition hover:bg-white/40\">\n                    <i class=\"fas fa-vial mr-5 text-pink-400 text-2xl\"><\/i>\n                    <span class=\"font-bold text-sm text-slate-700 tracking-wide\">⚡ QUIZZES & TESTS<\/span>\n                    <i class=\"fas fa-arrow-right ml-auto text-pink-300/60 text-xs\"><\/i>\n                <\/div>\n            `;\n            showSection('category-section');\n            document.getElementById('subjectSearch').value = '';\n            const items = document.getElementById('subject-list')?.children;\n            if (items)\n                for (let el of items) el.style.display = '';\n            document.getElementById('no-results').classList.add('hidden');\n        }\n\n        function showItems(type) {\n            setProgress(100);\n            const items = course.subjects[curS][type] || [];\n            document.getElementById('view-title').innerHTML =\n                `<i class=\"fas ${type === 'CHAPTERS' ? 'fa-book' : 'fa-bolt'} mr-2 text-blue-400\"><\/i> ${type === 'CHAPTERS' ? 'LECTURES & NOTES' : 'QUIZZES & TESTS'}`;\n            const list = document.getElementById('chapter-list');\n            list.innerHTML = '';\n            if (items.length === 0) {\n                list.innerHTML =\n                    '<div class=\"glass-card p-10 text-center text-slate-400 text-sm font-medium\">✨ No content yet. Stay connected!<\/div>';\n                showSection('content-section');\n                return;\n            }\n            items.forEach(ch => {\n                const btns = [];\n                if (ch.url) btns.push(\n                    `<button onclick=\"openLink('${ch.url.trim().split(' ')[0]}')\" class=\"btn-action btn-video\"><i class=\"fas fa-play mr-1\"><\/i> VIDEO<\/button>`\n                    );\n                if (ch.notes_en) btns.push(\n                    `<button onclick=\"openLink('${ch.notes_en.trim().split(' ')[0]}')\" class=\"btn-action btn-eng\"><i class=\"fas fa-file-alt mr-1\"><\/i> ENG NOTES<\/button>`\n                    );\n                if (ch.notes_hi) btns.push(\n                    `<button onclick=\"openLink('${ch.notes_hi.trim().split(' ')[0]}')\" class=\"btn-action btn-hindi\"><i class=\"fas fa-language mr-1\"><\/i> HINDI NOTES<\/button>`\n                    );\n                if (ch.quiz) btns.push(\n                    `<button onclick=\"openLink('${ch.quiz.trim().split(' ')[0]}')\" class=\"btn-action btn-quiz\"><i class=\"fas fa-question-circle mr-1\"><\/i> QUIZ<\/button>`\n                    );\n                if (ch.handwritten) btns.push(\n                    `<button onclick=\"openLink('${ch.handwritten.trim().split(' ')[0]}')\" class=\"btn-action btn-ppt\"><i class=\"fas fa-chalkboard-user mr-1\"><\/i> PPT/PDF<\/button>`\n                    );\n                const cols = btns.length === 1 ? 'grid-cols-1' : btns.length === 2 ? 'grid-cols-2' : 'grid-cols-2';\n                list.innerHTML += `\n                    <div class=\"glass-card p-6 text-left transition hover:shadow-lg\">\n                        <h4 class=\"font-bold mb-4 text-slate-800 text-sm border-b border-slate-200/70 pb-3 leading-relaxed tracking-wide\">${ch.title}<\/h4>\n                        <div class=\"grid ${cols} gap-3\">${btns.join('')}<\/div>\n                    <\/div>\n                `;\n            });\n            showSection('content-section');\n        }\n\n        function showSection(id) {\n            ['subject-section', 'category-section', 'content-section'].forEach(d => {\n                const el = document.getElementById(d);\n                if (d === id) {\n                    el.classList.remove('hidden');\n                    el.style.opacity = '1';\n                    el.style.transform = 'translateY(0)';\n                } else {\n                    el.classList.add('hidden');\n                    el.style.opacity = '0';\n                    el.style.transform = 'translateY(8px)';\n                }\n            });\n            window.scrollTo({ top: 0, behavior: 'smooth' });\n        }\n\n        // Init\n        showSubjects();\n    <\/script>\n<\/body>\n<\/html>\n"}</script>
<script>
const DATA = {
  structure: {
    'Parmar Batches': {type:'folder', items:{'Bhutesh Maths Foundation': {type:'course'}, 'PC Batch 2.0': {type:'course'}, 'Parmar 4.0': {type:'course'}, 'Parmar English Batch': {type:'course'}, 'Parmar Maths Revision': {type:'course'}, 'Parmar Monthly CA': {type:'course'}, 'Parmar Reasoning Foundation': {type:'course'}, 'Parmar Reasoning Revision Vod': {type:'course'}, 'SSC Repeaters': {type:'course'}, 'UP Lekhpal': {type:'course'}}}
  }
};

let path = [];

function loadFolder() {
  let current = DATA.structure;
  let items = [];
  
  if(path.length === 0) {
    items = Object.keys(current).map(k => ({name: k, type: current[k].type}));
  } else {
    let key = path[path.length-1];
    if(current[key] && current[key].items) {
      items = Object.keys(current[key].items).map(k => ({name: k, type: current[key].items[k].type}));
    }
  }
  
  renderList(items);
  updateBreadcrumb();
}

function renderList(items) {
  const container = document.getElementById('itemsContainer');
  container.innerHTML = '';
  
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'item-card';
    let icon = item.type === 'folder' ? '📁' : '📋';
    if(item.name === 'Parmar Batches') icon = '<img src="https://user43441.na.imgto.link/public/20261011/fdd6e17d1e8b6e7eca0b77bf-63445.avif" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.replaceWith(document.createTextNode(\'📁\'))">';
    
    card.innerHTML = `
      <div class="item-content">
        <div class="icon-circle">${icon}</div>
        <div><div class="item-name">${item.name}</div><div class="item-type">${item.type}</div></div>
      </div>
      <div class="arrow">›</div>
    `;
    
    card.onclick = () => {
      if(item.type === 'folder') {
        path.push(item.name);
        loadFolder();
      } else {
        showContent(item.name);
      }
    };
    
    container.appendChild(card);
  });
}

let CONTENT = null, viewing = null, blobUrl = null, currentHtml = null;
function pathKey(name){ return path.length ? path[path.length-1] + '/' + name : name; }
function showContent(name) {
  if(!CONTENT) CONTENT = JSON.parse(document.getElementById('contentStore').textContent);
  const html = CONTENT[pathKey(name)];
  if(!html){ alert('Content not found'); return; }
  const inj = '<scr'+'ipt>('+GUARD_FN.toString()+')(document);('+LINK_FN.toString()+')(document);</scr'+'ipt>';
  const out = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function(m){return m+inj;}) : inj+html;
  currentHtml = out;
  viewing = name;
  document.getElementById('contentTitle').textContent = '📖 ' + name;
  document.getElementById('contentFrame').srcdoc = currentHtml;
  document.getElementById('contentViewer').classList.add('show');
  document.body.classList.add('viewing');
  window.scrollTo(0,0);
  updateBreadcrumb();
}
function closeContent(){
  toggleFull(false);
  viewing = null;
  document.getElementById('contentFrame').removeAttribute('srcdoc'); document.getElementById('contentFrame').src = 'about:blank'; currentHtml = null;
  if(blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl = null; }
  document.getElementById('contentViewer').classList.remove('show');
  document.body.classList.remove('viewing');
}
function openNewTab(){
  if(!currentHtml) return;
  var w = null;
  try { w = window.open('', '_blank'); } catch(e) {}
  if(w && w.document){
    try { w.document.open(); w.document.write(currentHtml); w.document.close(); return; } catch(e) {}
  }
  alert('Popup blocked – please allow pop-ups to open in a new tab.');
}
function toggleFull(on){
  var v = document.getElementById('contentViewer');
  var f = (on === undefined) ? !v.classList.contains('full') : on;
  v.classList.toggle('full', f);
  
}

function updateBreadcrumb() {
  const backBtn = document.getElementById('backBtn');
  const breadcrumb = document.getElementById('breadcrumb');
  
  const trail = viewing ? path.concat([viewing]) : path;
  if(trail.length === 0) {
    backBtn.classList.remove('show');
    breadcrumb.innerHTML = '<b>Home</b>';
  } else {
    backBtn.classList.add('show');
    breadcrumb.innerHTML = '<b>' + trail.join(' / ') + '</b>';
  }
}

function goBack() {
  if(viewing) { closeContent(); updateBreadcrumb(); return; }
  if(path.length > 0) {
    path.pop();
    loadFolder();
  }
}

document.getElementById('searchBox').addEventListener('input', function(e) {
  const q = e.target.value.toLowerCase();
  let current = DATA.structure;
  let items = [];
  
  if(path.length === 0) {
    items = Object.keys(current).filter(k => k.toLowerCase().includes(q)).map(k => ({name: k, type: current[k].type}));
  } else {
    let key = path[path.length-1];
    if(current[key] && current[key].items) {
      items = Object.keys(current[key].items).filter(k => k.toLowerCase().includes(q)).map(k => ({name: k, type: current[key].items[k].type}));
    }
  }
  
  renderList(items);
});

window.addEventListener('load', () => {
  loadFolder();
  document.getElementById('noteBox').classList.add('show');
});
</script>

<script>
/* EduArya – basic copy/edit deterrent (cannot stop a determined user) */
var GUARD_FN=function(doc){
  function okTarget(e){ var t=e.target; return t && /^(INPUT|TEXTAREA)$/.test(t.tagName); }
  try{
    if(doc.__dwGuard) return; doc.__dwGuard=true;
    doc.addEventListener('contextmenu',function(e){ e.preventDefault(); });
    ['copy','cut','dragstart'].forEach(function(ev){ doc.addEventListener(ev,function(e){ if(!okTarget(e)) e.preventDefault(); }); });
    doc.addEventListener('selectstart',function(e){ if(!okTarget(e)) e.preventDefault(); });
    doc.addEventListener('keydown',function(e){
      var k=(e.key||'').toLowerCase(), c=e.ctrlKey||e.metaKey;
      if(e.key==='F12' || (c&&e.shiftKey&&/^[ijc]$/.test(k)) || (c&&/^[usap]$/.test(k) && !okTarget(e))){ e.preventDefault(); e.stopPropagation(); }
    },true);
    var st=doc.createElement('style');
    st.textContent='*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;} input,textarea{-webkit-user-select:text;user-select:text;} img{-webkit-user-drag:none;}';
    (doc.head||doc.documentElement).appendChild(st);
  }catch(err){}
};
var LINK_FN=function(doc){
  doc.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null; if(!a) return;
    var h=a.getAttribute('href')||'';
    if(h===''||h==='#'){ e.preventDefault(); return; }
    if(h.charAt(0)==='#'){ e.preventDefault(); var t=doc.getElementById(h.slice(1)); if(t&&t.scrollIntoView) t.scrollIntoView(); }
  },true);
};
GUARD_FN(document);
</script>
